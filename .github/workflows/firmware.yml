# Unit tests and firmware builds on every push and pull request. A tag `v<version>` (e.g. v2.0.0)
# additionally publishes a GitHub release with the flash images and release.json, which the
# NetIgnite server reads for its web installer and OTA updates.
#
# Optional repository secret FIRMWARE_SIGNING_KEY: a PEM ECDSA P-256 private key
# (scripts/generate_signing_key.sh). With it, releases include firmware.sig.

name: Firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PLATFORMIO_VERSION: "6.2.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "platformio==${PLATFORMIO_VERSION}"
      - run: pio test -e native

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "NETIGNITE_FW_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - run: pio run -e esp32dev -e esp32dev-qemu
      - run: python scripts/check_size.py

      - name: Sign
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          if [ -n "$FIRMWARE_SIGNING_KEY" ]; then
            printf '%s' "$FIRMWARE_SIGNING_KEY" > signing-key.pem
            openssl dgst -sha256 -sign signing-key.pem -out firmware.sig .pio/build/esp32dev/firmware.bin
            rm signing-key.pem
            echo "SIGNATURE_ARG=--signature firmware.sig" >> "$GITHUB_ENV"
          else
            echo "::warning::FIRMWARE_SIGNING_KEY isn't set; the release is unsigned."
          fi

      - name: Collect
        run: |
          python scripts/collect_release.py "${NETIGNITE_FW_VERSION:-dev}" release ${SIGNATURE_ARG:-}
          cp .pio/build/esp32dev/firmware.factory.bin release/firmware-factory.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: release/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-qemu
          path: .pio/build/esp32dev-qemu/firmware.factory.bin
          retention-days: 3

  # Boots the firmware in Espressif's QEMU and tests Improv and the console (test/emulator).
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QEMU_URL: https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20260417/qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz
      QEMU_SHA256: 0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-qemu
          path: qemu-firmware
      - uses: oven-sh/setup-bun@v2
      - name: QEMU
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libslirp0
          curl -sSL -o qemu.tar.xz "$QEMU_URL"
          echo "$QEMU_SHA256  qemu.tar.xz" | sha256sum -c -
          tar -xf qemu.tar.xz
      - working-directory: test/emulator
        run: |
          bun install --frozen-lockfile
          bun improv-test.ts "$GITHUB_WORKSPACE/qemu/bin/qemu-system-xtensa" "$GITHUB_WORKSPACE/qemu-firmware/firmware.factory.bin" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: emulator-serial-log
          path: ${{ runner.temp }}/improv-transcript.log
          retention-days: 7

  # Tags only, after the unit, build and emulator checks passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
