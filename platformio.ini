; NetIgnite ESP32 agent, firmware v2.
;
; Build:   pio run -e esp32dev
; Flash:   pio run -e esp32dev -t upload   (or use the web installer in the NetIgnite dashboard)
; Tests:   pio test -e native

[platformio]
default_envs = esp32dev

[env:esp32dev]
; pioarduino = Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5. Pinned: firmware builds must be reproducible.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
; Two 1.875 MB OTA slots (min_spiffs layout). NVS stays at 0x9000, which the web installer writes.
board_build.partitions = partitions.csv
lib_deps =
	links2004/WebSockets@2.7.3
	bblanchon/ArduinoJson@7.4.3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-Wall
	-DCORE_DEBUG_LEVEL=0
; Generate the trusted root certificate bundle and the firmware version before building.
extra_scripts =
	pre:data/cert/run_gen_script.py
	pre:scripts/version.py
board_build.embed_files =
	data/cert/x509_crt_bundle.bin

[env:esp32dev-qemu]
; For Espressif's QEMU (no Wi-Fi radio): the same firmware with Wi-Fi disabled, to test the serial
; console, Improv and settings without hardware. Not for real boards.
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DNETIGNITE_EMULATOR

[env:native]
; Host-side unit tests for the parts that don't need hardware (parsers, encoders).
platform = native
lib_deps =
	bblanchon/ArduinoJson@7.4.3
build_flags =
	-std=gnu++17
	-DNETIGNITE_NATIVE_TEST
build_src_filter = -<*>
test_build_src = no
lib_extra_dirs =
lib_compat_mode = off
